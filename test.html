<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio AI tests</title>
  <style>
    body { margin: 0; padding: 16px; background: #0e0d0c; color: #ded6c8; font: 13px Consolas, Menlo, monospace; }
    h2 { color: #e8a860; font-size: 16px; }
    .ok { color: #a8cc8c; margin: 4px 0; }
    .fail { color: #e66e64; margin: 4px 0; }
    span { color: #807868; }
  </style>
</head>
<body>
  <div id="results">running…</div>

  <script type="module">
    // the tests use one RA object with every class in it
    import * as all from './src/all.js';
    window.RA = Object.assign({}, all);
    for (const src of ['tests/TestRunner.js', 'tests/suite.js']) {
      await new Promise((ok, fail) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = fail; document.body.appendChild(el); });
    }
  </script>
</body>
</html>
